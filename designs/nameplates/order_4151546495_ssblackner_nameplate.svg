<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nameplate - RESHIP for Order 4151546495 (buyer: ssblackner / Sally Blackner)
  Item: RFA-0764 Personalized Racing Award (steering-wheel trophy)
  Personalization: UmeCon 2026 / Racing Legend / September 11, 2026
  Plate size: 3in x 1in (rendered at 300 px/in = 900 x 300)
  Note: original plate was mounted on the BACK of the award; this replacement
  plate is being reshipped so the customer can mount it on the FRONT.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="3in" height="1in" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c15c"/>
      <stop offset="0.25" stop-color="#f5e3a1"/>
      <stop offset="0.5" stop-color="#d4a93c"/>
      <stop offset="0.75" stop-color="#c69a2e"/>
      <stop offset="1" stop-color="#e8c968"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.5" stop-color="#b8860b"/>
      <stop offset="1" stop-color="#8a6508"/>
    </linearGradient>
  </defs>

  <!-- plate body with beveled edge -->
  <rect x="0" y="0" width="900" height="300" rx="10" fill="url(#bevel)"/>
  <rect x="10" y="10" width="880" height="280" rx="6" fill="url(#brass)" stroke="#8a6508" stroke-width="2"/>
  <!-- inner engraved border line -->
  <rect x="26" y="26" width="848" height="248" rx="4" fill="none" stroke="#3a2b06" stroke-width="2"/>

  <!-- engraved text (black fill) -->
  <g fill="#1a1206" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="450" y="112" font-size="64" font-weight="bold" letter-spacing="2">UmeCon 2026</text>
    <text x="450" y="188" font-size="56" font-weight="bold" letter-spacing="3">Racing Legend</text>
    <text x="450" y="254" font-size="44" letter-spacing="2">September 11, 2026</text>
  </g>
</svg>
